D(V13+"S8:4",()=>{const m=r(20,50),s=r(4,9),n=r(40,80),x=m+r(1,3),p=1-Ph((x-m)/(s/Math.sqrt(n)));return[`A random variable X (not normally distributed) has mean ${m} and standard deviation ${s}. A sample of ${n} is taken. Use the central limit theorem to find P(X̄ > ${x}), to 4 d.p.`,`X̄ ≈ N(${m}, ${s*s}/${n}); P = ${p.toFixed(4)}`]},()=>{const m=r(20,50),s=r(4,9),n=r(50,100),d=r(1,2),sd=s/Math.sqrt(n),p=Ph(d/sd)-Ph(-d/sd);return[`A random variable X (not normally distributed) has mean ${m} and standard deviation ${s}. A sample of ${n} is taken. Find P(${m-d} < X̄ < ${m+d}), to 4 d.p.`,`X̄ ≈ N(${m}, ${s*s}/${n}); P = ${p.toFixed(4)}`]});
D(V13+"M5:1",()=>{const q=r(2,9);return pick([[`Write down the distance of the centre of mass of a uniform semicircular lamina of radius ${q} cm from its straight edge`,`\\f{${4*q}}{3π} cm`],[`Write down the distance of the centre of mass of a uniform triangular lamina of height ${q*3} cm from its base`,`${q} cm`],[`Write down the distance of the centre of mass of a uniform semicircular arc of radius ${q} cm from its diameter`,`\\f{${2*q}}{π} cm`]])},()=>{const q=r(3,9);return pick([[`A uniform solid hemisphere has radius ${q} cm. Find the distance of its centre of mass from the centre of its plane face`,`\\f{3 × ${q}}{8} = ${fr(3*q,8)} cm`],[`A uniform solid cone has height ${4*q} cm. Find the distance of its centre of mass from its vertex`,`${3*q} cm`]])});
D(V13+"M6:3",()=>{const F=[r(-3,5),r(-3,5)],d=[r(1,6),r(-3,5)];return[`A force (${vs(F[0],F[1])}) N moves a particle through the displacement (${vs(d[0],d[1])}) m. Find the work done`,`F·d = (${F[0]})(${d[0]}) + (${F[1]})(${d[1]}) = ${F[0]*d[0]+F[1]*d[1]} J`]},()=>{const F=[r(1,6),r(1,6)],v=[r(1,5),r(-3,5)];return[`A force (${vs(F[0],F[1])}) N acts on a particle moving with velocity (${vs(v[0],v[1])}) m s^{-1}. Find the power`,`F·v = ${F[0]*v[0]+F[1]*v[1]} W`]});
D(V13+"M7:0",()=>{const a=r(2,6),u=r(1,5),t=r(1,3);return[`A particle has acceleration ${a}t^2 m s^{-2}. When t = 0 its velocity is ${u} m s^{-1}. Find its velocity when t = ${t}`,`v = ${cf(a,3)}t^3 + ${u} = ${cl(a*t**3/3+u)} m s^{-1}`]},()=>{const a=r(1,4),u=r(1,5),T=r(1,3);return[`A particle has acceleration ${6*a}t m s^{-2}. When t = 0 its velocity is ${u} m s^{-1} and its displacement is 0. Find its displacement when t = ${T}`,`v = ${3*a}t^2 + ${u}; s = ${co(a)}t^3${tm(u,"t")} = ${a*T**3+u*T} m`]});
D(V13+"M8:0",()=>{const m=r(2,5),u=[r(-3,5),r(-3,5)],v=[r(-3,5),r(-3,5)];return[`A ${m} kg ball has velocity (${vs(u[0],u[1])}) m s^{-1} before and (${vs(v[0],v[1])}) m s^{-1} after being hit. Find the impulse on the ball`,`m(v − u) = ${m}(${vs(v[0]-u[0],v[1]-u[1])}) = ${vs(m*(v[0]-u[0]),m*(v[1]-u[1]))} N s`]},()=>{const a=r(1,4),b=r(1,4),T=r(2,4);return[`A force F = (${co(a)}t i + ${b}j) N acts on a particle for ${T} s. Find the impulse`,`∫ F dt = (${cf(a*T*T,2)}i + ${b*T}j) N s`]});
D(V13+"M9:0",()=>{const v=r(3,12),R=r(2,8);return[`A particle moves in a vertical circle of radius ${R} m. At one instant its speed is ${v} m s^{-1}. Find its acceleration towards the centre`,`v^2 ÷ r = ${v*v} ÷ ${R} = ${d3(v*v/R)} m s^{-2}`]},()=>{const L=pick([1,1.5,2]),th=pick([30,45,60]),u=Math.sqrt(g*L*pick([5,6,8])),v2=u*u-2*g*L*(1-cs(th));return[`A particle on a light string of length ${L} m is projected from the lowest point with speed ${d3(u)} m s^{-1}. When the string makes ${th}° with the downward vertical, find the radial and tangential components of its acceleration, to 3 s.f. (g = 9.8)`,`radial v^2 ÷ L = ${d3(v2/L)} m s^{-2}; tangential g sin ${th}° = ${d3(g*sn(th))} m s^{-2}`]});
// app
const M=new Set();let FZ=1;let tab="Y12 Maths",ci=0,Q=[[],[]];
const $=id=>document.getElementById(id),sub=()=>CH[tab][ci];
const key=(i)=>KK(tab,sub(),i);
function build(){
 $("tabs").innerHTML=Object.keys(T).map(t=>`<button class="${t==tab?"on":""}" data-t="${t}">${t}</button>`).join("");
 const cs=CH[tab],g={P:"Pure",S:"Statistics",M:"Mechanics"};let h="";
 for(const s of["P","S","M"]){const l=cs.map((c,i)=>[c,i]).filter(x=>x[0].s==s);if(l.length)h+=`<optgroup label="${g[s]}">`+l.map(([c,i])=>`<option value="${i}">${c.n}. ${c.nm}</option>`).join("")+"</optgroup>"}
 $("ch").innerHTML=h;$("ch").value=ci;fillSub();
}
function fillSub(){const c=sub();$("sb").innerHTML=`<option value="-1">All subsections</option>`+c.sb.map((s,i)=>`<option value="${i}">${c.n}.${i+1} ${s}${G[key(i)]?" ●":""}</option>`).join("");}
function pool(L){const v=+$("sb").value;const o=(M.size?[...M]:(v<0?sub().sb.map((_,i)=>i):[v]).map(key)).filter(k=>G[k]||GC[k]).map(k=>L&&GC[k]?GC[k]:[].concat(G[k]||[])).filter(a=>a.length);return o.length||M.size||!$("fill")||!$("fill").checked?o:(()=>{const e=sibs(L);return e.length?[e]:[]})()}
function sibs(L){return sub().sb.map((_,i)=>key(i)).filter(k=>G[k]||GC[k]).map(k=>L&&GC[k]?GC[k]:[].concat(G[k]||[])).flat()}
function one(L,col){const fs_=pool(L).flat(),used=Q[col].map(x=>x.f);let fresh=fs_.filter(f=>!used.includes(f));if(!fresh.length&&$("fill").checked&&!M.size){const ex=sibs(L).filter(f=>!used.includes(f));if(ex.length)fresh=ex}const c=fresh.length?fresh:fs_,sg_=t=>t.replace(/[0-9.]+/g,"#");let q;for(let k=0;k<40;k++){const f=pick(c);q=f(L);q.f=f;if(!Q[col].some(x=>x[0]==q[0]||(k<25&&sg_(x[0])==sg_(q[0]))))break}return q}
function gen(){const n=+$("nq").value;Q=[[],[]];if(pool().length)for(let c=0;c<2;c++)for(let i=0;i<n;i++)Q[c].push(one(c,c));draw()}
function fs(){const n=Q[0].length||5;document.documentElement.style.setProperty("--fs",((n<=3?2.3:n<=5?1.9:n<=7?1.6:1.35)*FZ)+"rem")}
function draw(){const m=$("m"),c=sub();$("ch").style.borderColor="var(--"+c.s+")";
 if(!Q[0].length){m.innerHTML=`<div class="msg">${pool().length?"Press New questions.":"Questions for this subsection are still being written. Subsections marked ● are ready."}</div>`;return}
 const n=Q[0].length;fs();
 m.innerHTML=["Standard","Challenge"].map((t,ci)=>`<section class="col ${$("sa").dataset.on?"ans":""}" style="--cc:${ci?"var(--S)":"var(--"+c.s+")"}"><h2>${t}</h2>`+Q[ci].map((q,i)=>`<div class="q"><button class="n" data-c="${ci}" data-i="${i}" title="Swap this question">${i+1}</button><div class="t">${F(q[0])}<div class="a">${F(q[1])}</div></div></div>`).join("")+"</section>").join("")}
$("nq").innerHTML=Array.from({length:10},(_,i)=>`<option ${i==4?"selected":""}>${i+1}</option>`).join("");
$("tabs").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;ci=0;Q=[[],[]];build();draw()}};
$("ch").onchange=e=>{ci=+e.target.value;Q=[[],[]];fillSub();draw()};
$("sb").onchange=()=>{Q=[[],[]];draw()};$("nq").onchange=()=>{if(Q[0].length)gen()};
$("go").onclick=gen;$("pr").onclick=()=>print();
$("sa").onclick=e=>{const b=e.target;b.dataset.on=b.dataset.on?"":"1";b.textContent=b.dataset.on?"Hide answers":"Show answers";document.querySelectorAll(".col").forEach(c=>c.classList.toggle("ans",!!b.dataset.on))};
$("m").onclick=e=>{const b=e.target.closest(".n");if(b){const c=+b.dataset.c,i=+b.dataset.i;Q[c][i]=one(c,c);draw();return}const t=e.target.closest(".t");if(t)t.parentElement.classList.toggle("open")};
$("fm").onclick=()=>{FZ=Math.max(.5,+(FZ-.1).toFixed(2));fs()};$("fp").onclick=()=>{FZ=Math.min(2.2,+(FZ+.1).toFixed(2));fs()};
const gn={P:"Pure",S:"Statistics",M:"Mechanics"},mxl=()=>$("mx").textContent=M.size?`Mix topics (${M.size})`:"Mix topics";
function mixUI(){let h=`<div class=bar>${["P","S","M"].map(s=>`<button class=act data-s=${s} style="background:var(--${s})">All ${gn[s]}</button>`).join("")}<button class=act data-s=x>Clear mix</button><button class=act data-s=d>Done</button></div>`;
 CH[tab].forEach(c=>{h+=`<details><summary style="color:var(--${c.s})">${c.n}. ${c.nm}</summary>`+c.sb.map((s,i)=>{const k=KK(tab,c,i),ok=G[k];return`<label class="${ok?"":"dis"}" style="display:block;margin-left:18px"><input type=checkbox data-k="${k}" ${ok?"":"disabled"} ${M.has(k)?"checked":""}> ${s}</label>`}).join("")+"</details>"});
 $("mix").innerHTML=h;mxl()}
$("mx").onclick=()=>{const m=$("mix");m.hidden=!m.hidden;if(!m.hidden)mixUI()};
$("mix").onclick=e=>{const t=e.target,s=t.dataset.s;if(s=="d")$("mix").hidden=true;else if(s){if(s=="x")M.clear();else CH[tab].forEach(c=>{if(c.s==s)c.sb.forEach((_,i)=>{const k=KK(tab,c,i);if(G[k])M.add(k)})});mixUI();Q=[[],[]];draw()}else if(t.dataset.k){t.checked?M.add(t.dataset.k):M.delete(t.dataset.k);mxl();Q=[[],[]];draw()}};
build();draw();
</script></body></html>
