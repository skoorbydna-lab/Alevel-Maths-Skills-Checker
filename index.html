// app
const M=new Set();let FZ=1;let tab="Y12 Maths",ci=0,Q=[[],[]];
const $=id=>document.getElementById(id),sub=()=>CH[tab][ci];
const key=(i)=>KK(tab,sub(),i);
function build(){
 $("tabs").innerHTML=Object.keys(T).map(t=>`<button class="${t==tab?"on":""}" data-t="${t}">${t}</button>`).join("");
 const cs=CH[tab],g={P:"Pure",S:"Statistics",M:"Mechanics"};let h="";
 for(const s of["P","S","M"]){const l=cs.map((c,i)=>[c,i]).filter(x=>x[0].s==s);if(l.length)h+=`<optgroup label="${g[s]}">`+l.map(([c,i])=>`<option value="${i}">${c.n}. ${c.nm}</option>`).join("")+"</optgroup>"}
 $("ch").innerHTML=h;$("ch").value=ci;fillSub();
}
function fillSub(){const c=sub();$("sb").innerHTML=`<option value="-1">All subsections</option>`+c.sb.map((s,i)=>`<option value="${i}">${c.n}.${i+1} ${s}${G[key(i)]?" ●":""}</option>`).join("");}
function pool(L){const v=+$("sb").value;const o=(M.size?[...M]:(v<0?sub().sb.map((_,i)=>i):[v]).map(key)).filter(k=>G[k]||GC[k]).map(k=>L&&GC[k]?GC[k]:[].concat(G[k]||[])).filter(a=>a.length);return o.length||M.size||!$("fill")||!$("fill").checked?o:(()=>{const e=sibs(L);return e.length?[e]:[]})()}
function sibs(L){return sub().sb.map((_,i)=>key(i)).filter(k=>G[k]||GC[k]).map(k=>L&&GC[k]?GC[k]:[].concat(G[k]||[])).flat()}
function one(L,col){const fs_=pool(L).flat(),used=Q[col].map(x=>x.f);let fresh=fs_.filter(f=>!used.includes(f));if(!fresh.length&&$("fill").checked&&!M.size){const ex=sibs(L).filter(f=>!used.includes(f));if(ex.length)fresh=ex}const c=fresh.length?fresh:fs_,sg_=t=>t.replace(/[0-9.]+/g,"#");let q;for(let k=0;k<40;k++){const f=pick(c);q=f(L);q.f=f;if(!Q[col].some(x=>x[0]==q[0]||(k<25&&sg_(x[0])==sg_(q[0]))))break}return q}
function gen(){const n=+$("nq").value;Q=[[],[]];if(pool().length)for(let c=0;c<2;c++)for(let i=0;i<n;i++)Q[c].push(one(c,c));draw()}
function fs(){const n=Q[0].length||5;document.documentElement.style.setProperty("--fs",((n<=3?2.3:n<=5?1.9:n<=7?1.6:1.35)*FZ)+"rem")}
function draw(){const m=$("m"),c=sub();$("ch").style.borderColor="var(--"+c.s+")";
 if(!Q[0].length){m.innerHTML=`<div class="msg">${pool().length?"Press New questions.":"Questions for this subsection are still being written. Subsections marked ● are ready."}</div>`;return}
 const n=Q[0].length;fs();
 m.innerHTML=["Standard","Challenge"].map((t,ci)=>`<section class="col ${$("sa").dataset.on?"ans":""}" style="--cc:${ci?"var(--S)":"var(--"+c.s+")"}"><h2>${t}</h2>`+Q[ci].map((q,i)=>`<div class="q"><button class="n" data-c="${ci}" data-i="${i}" title="Swap this question">${i+1}</button><div class="t">${F(q[0])}<div class="a">${F(q[1])}</div></div></div>`).join("")+"</section>").join("")}
$("nq").innerHTML=Array.from({length:10},(_,i)=>`<option ${i==4?"selected":""}>${i+1}</option>`).join("");
$("tabs").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;ci=0;Q=[[],[]];build();draw()}};
$("ch").onchange=e=>{ci=+e.target.value;Q=[[],[]];fillSub();draw()};
$("sb").onchange=()=>{Q=[[],[]];draw()};$("nq").onchange=()=>{if(Q[0].length)gen()};
$("go").onclick=gen;$("pr").onclick=()=>print();
$("sa").onclick=e=>{const b=e.target;b.dataset.on=b.dataset.on?"":"1";b.textContent=b.dataset.on?"Hide answers":"Show answers";document.querySelectorAll(".col").forEach(c=>c.classList.toggle("ans",!!b.dataset.on))};
$("m").onclick=e=>{const b=e.target.closest(".n");if(b){const c=+b.dataset.c,i=+b.dataset.i;Q[c][i]=one(c,c);draw();return}const t=e.target.closest(".t");if(t)t.parentElement.classList.toggle("open")};
$("fm").onclick=()=>{FZ=Math.max(.5,+(FZ-.1).toFixed(2));fs()};$("fp").onclick=()=>{FZ=Math.min(2.2,+(FZ+.1).toFixed(2));fs()};
const gn={P:"Pure",S:"Statistics",M:"Mechanics"},mxl=()=>$("mx").textContent=M.size?`Mix topics (${M.size})`:"Mix topics";

 $("mix").innerHTML=h;$("mix").querySelectorAll("input[data-p]").forEach(i=>i.indeterminate=true);mxl()}

$("mx").onclick=()=>{const m=$("mix");m.hidden=!m.hidden;if(!m.hidden)mixUI()};
$("mix").onclick=e=>{const t=e.target,s=t.dataset.s;if(s=="d")$("mix").hidden=true;else if(s){if(s=="x")M.clear();else CH[tab].forEach(c=>{if(c.s==s)c.sb.forEach((_,i)=>{const k=KK(tab,c,i);if(G[k])M.add(k)})});mixUI();Q=[[],[]];draw()}else if(t.dataset.c!==undefined){const c=CH[tab][+t.dataset.c];c.sb.forEach((_,i)=>{const k=KK(tab,c,i);if(G[k])t.checked?M.add(k):M.delete(k)});mxo.clear();$("mix").querySelectorAll("details[open]").forEach(d=>mxo.add(d.dataset.o));mixUI();Q=[[],[]];draw()}else if(t.dataset.k){t.checked?M.add(t.dataset.k):M.delete(t.dataset.k);mxl();Q=[[],[]];draw()}};
build();draw();
